---

- block:
  - name: run bootstrap tests
    include_tasks: bootstrap_tests.yml

  - name: run tests
    include_tasks: tests.yml

  - name: run choco v1 tests
    include_tasks: choco_v1_tests.yml

  always:
  # The ignore_pinned tests leave a pin behind. Chocolatey CLI skips pinned packages
  # on uninstall and still exits 0, so without this the package survives the cleanup
  # and leaks into whichever target runs next.
  - name: ensure test packages are unpinned after tests
    win_command: choco.exe pin remove --name {{ item | quote }}
    loop: '{{ test_choco_packages }}'
    register: unpin_after_tests
    changed_when: unpin_after_tests.rc == 0
    failed_when: false

  - name: ensure test package is uninstalled after tests
    win_chocolatey:
      name: '{{ test_choco_packages }}'
      state: absent

  - name: remove test sources
    win_chocolatey_source:
      name: '{{ item }}'
      state: absent
    with_items:
    - ansible-test
    - ansible-test-override

  - name: remove testing dir
    win_file:
      path: '{{ test_choco_path }}'
      state: absent

  - name: ensure latest choco is installed after tests run
    win_chocolatey:
      name: chocolatey
      state: upgrade
