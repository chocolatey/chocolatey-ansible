---
- name: Ensure there are no facts from previous tests
  ansible.builtin.meta: clear_facts

- name: Gather all facts, with implied "all" filter
  win_chocolatey_facts:

- name: assert all chocolatey facts are gathered 
  assert:
    that:
    - ansible_facts.chocolatey is not changed
    - ansible_facts.chocolatey.outdated is defined
    - ansible_facts.chocolatey.config is defined
    - ansible_facts.chocolatey.feature is defined
    - ansible_facts.chocolatey.packages is defined
    - ansible_facts.chocolatey.sources is defined
    - '"config" not in ansible_facts.chocolatey.filter'
    - '"feature" not in ansible_facts.chocolatey.filter'
    - '"packages" not in ansible_facts.chocolatey.filter'
    - '"sources" not in ansible_facts.chocolatey.filter'
    - '"outdated" not in ansible_facts.chocolatey.filter'
    - '"all" in ansible_facts.chocolatey.filter'

- name: Ensure there are no facts from previous tests
  ansible.builtin.meta: clear_facts

- name: Gather facts, except outdated packages
  win_chocolatey_facts:
    filter:
    - 'config'
    - 'feature'
    - 'packages'
    - 'sources'

- name: assert all chocolatey facts except for outdated packages are gathered
  assert:
    that:
    - ansible_facts.chocolatey is not changed
    - ansible_facts.chocolatey.outdated is not defined
    - ansible_facts.chocolatey.config is defined
    - ansible_facts.chocolatey.feature is defined
    - ansible_facts.chocolatey.packages is defined
    - ansible_facts.chocolatey.sources is defined
    - '"config" in ansible_facts.chocolatey.filter'
    - '"feature" in ansible_facts.chocolatey.filter'
    - '"packages" in ansible_facts.chocolatey.filter'
    - '"sources" in ansible_facts.chocolatey.filter'
    - '"outdated" not in ansible_facts.chocolatey.filter'
    - '"all" not in ansible_facts.chocolatey.filter'

- name: Ensure there are no facts from previous tests
  ansible.builtin.meta: clear_facts

- name: Gather config and feature facts only
  win_chocolatey_facts:
    filter:
    - 'config'
    - 'feature'

- name: assert only config and feature chocolatey facts are gathered
  assert:
    that:
    - ansible_facts.chocolatey is not changed
    - ansible_facts.chocolatey.config is defined
    - ansible_facts.chocolatey.feature is defined
    - ansible_facts.chocolatey.outdated is not defined
    - ansible_facts.chocolatey.packages is not defined
    - ansible_facts.chocolatey.sources is not defined
    - '"config" in ansible_facts.chocolatey.filter'
    - '"feature" in ansible_facts.chocolatey.filter'
    - '"all" not in ansible_facts.chocolatey.filter'
